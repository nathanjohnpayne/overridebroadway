version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Every other minor and patch update shares one PR. Majors open as
      # individual PRs (mergepath#1802).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.x supports TypeScript >=4.8.4 <6.1.0; a TS 7
      # bump breaks `npm run lint`. Lift once typescript-eslint supports it.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # eslint-plugin-react 7.37.x crashes under eslint 10 (settings.react
      # version "detect" calls the removed context.getFilename()). Lift
      # once eslint-plugin-react ships eslint 10 support.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]
    groups:
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      eslint-core:
        patterns:
          - "eslint"
          - "@eslint/*"
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      typescript-toolchain:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      firebase-sdk:
        patterns:
          - "firebase"
          - "@firebase/*"
      # Every other minor and patch update shares one PR. Majors open as
      # individual PRs (mergepath#1802).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
